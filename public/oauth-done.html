<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Alfred · Google</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #000; color: #ecfeff; padding: 24px; box-sizing: border-box;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; text-align: center;
      }
      .card { max-width: 360px; border: 1px solid rgba(34, 211, 238, 0.35); padding: 28px 22px; border-radius: 12px;
        background: linear-gradient(160deg, rgba(6, 22, 32, 0.95), rgba(2, 8, 14, 0.95)); }
      .mark { font-size: 44px; line-height: 1; color: #22d3ee; text-shadow: 0 0 16px rgba(34, 211, 238, 0.6); }
      .mark.err { color: #fbbf24; text-shadow: none; }
      h1 { font-size: 18px; letter-spacing: 0.08em; margin: 14px 0 8px; }
      p { color: #a5f3fc; font-size: 14px; line-height: 1.5; margin: 8px 0; }
      a { color: #22d3ee; }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <div class="mark" id="mark">✓</div>
      <h1 id="title">Google connected</h1>
      <p id="msg">Switch back to the <strong>Alfred</strong> app on your Home Screen. It picks up Gmail and Calendar automatically.</p>
      <p>You can close this Safari tab.</p>
    </main>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.get("ok") === "1") return;
        var reasons = {
          denied: "Sign-in was cancelled, or your Google account isn't on the app's test-user list.",
          redirect: "Google's redirect address doesn't match. Check the Authorized redirect URIs in Google Cloud.",
          client: "Alfred's Google client ID or secret on Netlify is wrong.",
          token: "Google rejected the sign-in. Check the client secret and redirect address.",
          missing: "Google didn't send back a sign-in code. Try again.",
          state: "The sign-in session expired. Try again from the Alfred app.",
        };
        document.getElementById("mark").textContent = "!";
        document.getElementById("mark").className = "mark err";
        document.getElementById("title").textContent = "Google didn't connect";
        document.getElementById("msg").textContent =
          (reasons[q.get("oauth_error")] || "Sign-in didn't finish.") + " Go back to Alfred and tap Connect Google again.";
      })();
    </script>
  </body>
</html>
