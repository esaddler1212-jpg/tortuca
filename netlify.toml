[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[context.production.environment]
  BATTLEWORLD_LATTICE_REQUIRE_SESSION = "true"

# Web research + Claude can exceed the default 10s Lambda limit.
[functions."business-research"]
  timeout = 26

[functions."ask"]
  timeout = 26

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Vite content-hashes everything in /assets, so a changed file always gets a new URL.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
