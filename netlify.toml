[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Web research + Claude can exceed the default 10s Lambda limit.
[functions."business-research"]
  timeout = 26

[functions."ask"]
  timeout = 26

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
