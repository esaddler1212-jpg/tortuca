[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA: Netlify serves static files and functions first; this handles client routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
