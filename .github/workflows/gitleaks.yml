name: Secret scan

# Fails the check if an API key, token or password lands in a commit.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --config .gitleaks.toml --log-opts="--all" --redact --no-banner --verbose
