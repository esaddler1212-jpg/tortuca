name: VantageGames

on:
  push:
    paths:
      - 'vantage-games/**'
      - 'games-hub/**'
      - 'drive-world/**'
      - 'flight-nemulator/**'
      - '.github/workflows/vantage-games.yml'
  pull_request:
    paths:
      - 'vantage-games/**'
      - 'games-hub/**'
      - 'drive-world/**'
      - 'flight-nemulator/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vantage-games
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vantage-games/package-lock.json
      - run: npm ci
      - run: npm run build:with-console
