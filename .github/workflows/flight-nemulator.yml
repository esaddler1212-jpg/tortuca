name: Flight Nemulator

on:
  push:
    paths:
      - 'flight-nemulator/**'
      - '.github/workflows/flight-nemulator.yml'
  pull_request:
    paths:
      - 'flight-nemulator/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-nemulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: flight-nemulator/package-lock.json
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm run build
      - name: Smoke boot
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:smoke
