# Tortuca Console — PlayStation-style launcher (City Nights + Flight Nemulator)

[build]
  command = "npm ci && npm run build:all"
  publish = "dist"

[[headers]]
  for = "/city-nights/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/flight-nemulator/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/city-nights/*"
  to = "/city-nights/index.html"
  status = 200

[[redirects]]
  from = "/flight-nemulator/*"
  to = "/flight-nemulator/index.html"
  status = 200
