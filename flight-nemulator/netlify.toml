# Flight Nemulator — standalone Netlify site (base directory: flight-nemulator)

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
