# Standalone Netlify site: set "Base directory" to `drive-world` in the Netlify UI.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
