<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Drive World — Bay Night</title>
    <link rel="stylesheet" href="/src/starter.css" />
  </head>
  <body>
    <canvas id="application-canvas"></canvas>
    <div id="hud" class="hud" aria-live="polite">
      <h1>Bay Night</h1>
      <p id="mission" class="hint">Loading…</p>
      <p id="vehicle-name" class="vehicle-name"></p>
      <p id="progress" class="progress-line"></p>
      <p id="speed">0 mph</p>
      <button id="reset-progress" type="button" class="reset-btn">New game</button>
    </div>

    <div id="car-picker" class="overlay" hidden>
      <div class="panel">
        <h2>Safehouse — pick up your car</h2>
        <p class="panel-hint">Waymo dropped you off. Choose your ride, then clear landmarks in each region.</p>
        <div id="picker-grid" class="picker-grid"></div>
      </div>
    </div>

    <div id="garage" class="garage" hidden>
      <h3>Safehouse garage</h3>
      <div id="garage-list" class="garage-list"></div>
      <div id="customize" class="customize" hidden>
        <h4>Customize</h4>
        <p class="customize-hint">Per car · saved to this browser</p>
        <div class="label">Paint</div>
        <div id="paint-swatches" class="paint-swatches"></div>
        <label class="slider-row">Glow <input id="slider-glow" type="range" min="0" max="100" /></label>
        <label class="slider-row">Power <input id="slider-power" type="range" min="0" max="100" /></label>
        <label class="slider-row">Grip <input id="slider-grip" type="range" min="0" max="100" /></label>
        <button id="apply-custom" type="button" class="apply-custom">Apply &amp; refresh</button>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
